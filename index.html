<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question & Answer Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); text-align: center; width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        button { padding: 14px; font-size: 16px; font-weight: 500; border: none; border-radius: 10px; cursor: pointer; transition: background-color 0.2s; }
        .btn-primary { background-color: #0071e3; color: #ffffff; }
        .btn-primary:hover { background-color: #0077ed; }
        .btn-secondary { background-color: #e8e8ed; color: #1d1d1f; }
        .btn-secondary:hover { background-color: #d2d2d7; }
        .btn-back { background-color: transparent; color: #0071e3; font-size: 14px; margin-top: 15px; text-decoration: underline; }
        input[type="text"], textarea { width: 100%; padding: 12px; margin-bottom: 5px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; font-family: inherit; }
        textarea { resize: none; height: 100px; }
        .word-counter { text-align: right; font-size: 12px; color: #6e6e73; margin-bottom: 15px; }
        .hidden { display: none; }
        .code-display { background-color: #f5f5f7; padding: 15px; border-radius: 8px; font-size: 22px; font-weight: 700; letter-spacing: 2px; margin: 15px 0; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 80%; }
        .btn-copy { background-color: #0071e3; color: white; font-size: 12px; padding: 6px 12px; border-radius: 6px; }
        .status-box { margin-top: 15px; padding: 15px; border-radius: 8px; background-color: #f5f5f7; text-align: left; font-size: 15px; }
        .status-unanswered { color: #bf4800; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div id="mainMenu">
        <h2>Welcome</h2>
        <div class="btn-group">
            <button class="btn-primary" onclick="showScreen('askScreen')">Ask a question</button>
            <button class="btn-secondary" onclick="showScreen('findScreen')">Find answer</button>
        </div>
    </div>
    <div id="askScreen" class="hidden">
        <h2>Ask a Question</h2>
        <textarea id="questionInput" placeholder="Type your question here..." oninput="checkWordCount(this)"></textarea>
        <div class="word-counter" id="wordCountLabel">Words: 0 / 50</div>
        <button class="btn-primary" style="width: 100%;" onclick="submitQuestion()">Submit</button>
        <button class="btn-back" onclick="goHome()">Back</button>
    </div>
    <div id="codeScreen" class="hidden">
        <h2>Your Saved Code</h2>
        <p style="font-size: 14px; color: #6e6e73;">Save this code to check your answer later:</p>
        <div class="code-display">
            <span id="generatedCode"></span>
            <button class="btn-copy" onclick="copyCode()">Copy</button>
        </div>
        <button class="btn-secondary" style="width: 100%;" onclick="goHome()">Done</button>
    </div>
    <div id="findScreen" class="hidden">
        <h2>Find Answer</h2>
        <input type="text" id="codeInput" placeholder="Enter 6-digit code">
        <button class="btn-primary" style="width: 100%;" onclick="searchAnswer()">Submit</button>
        <div id="answerResult" class="status-box hidden"></div>
        <button class="btn-back" onclick="goHome()">Back</button>
    </div>
</div>
<script>
    // Rotated channel key to force a clean, unbugged cloud initialization sync
    const CHANNEL_KEY = "robin_secure_qa_hub_v994821";
    const PROXY_URL = "https://corsproxy.io?";
    const TARGET_URL = `https://keyvalue.xyz{CHANNEL_KEY}/db`;

    function showScreen(screenId) {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('askScreen').classList.add('hidden');
        document.getElementById('codeScreen').classList.add('hidden');
        document.getElementById('findScreen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    function goHome() {
        document.getElementById('questionInput').value = '';
        document.getElementById('wordCountLabel').innerText = "Words: 0 / 50";
        document.getElementById('codeInput').value = '';
        document.getElementById('answerResult').classList.add('hidden');
        showScreen('mainMenu');
    }

    function checkWordCount(textarea) {
        let words = textarea.value.trim().split(/\s+/).filter(w => w.length > 0);
        if (words.length > 50) {
            textarea.value = textarea.value.split(/\s+/).slice(0, 50).join(" ");
            words = textarea.value.trim().split(/\s+/).filter(w => w.length > 0);
        }
        document.getElementById('wordCountLabel').innerText = `Words: ${words.length} / 50`;
    }

    function generateUniqueCode() {
        const characters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 6; i++) { code += characters.charAt(Math.floor(Math.random() * characters.length)); }
        return code;
    }

    function submitQuestion() {
        const questionText = document.getElementById('questionInput').value.trim();
        if (!questionText) { alert("Please type a question."); return; }
        const code = generateUniqueCode();

        fetch(PROXY_URL + encodeURIComponent(TARGET_URL))
        .then(res => res.status === 404 || res.status === 500 ? "{}" : res.text())
        .then(text => {
            let remoteDB = {};
            // Failsafe parser block
            if (text && text.trim() && !text.includes("Cannot GET") && !text.includes("Error")) {
                try { remoteDB = JSON.parse(text); } catch(e) { remoteDB = {}; }
            }
            if (typeof remoteDB !== 'object' || remoteDB === null || Array.isArray(remoteDB)) { remoteDB = {}; }
            
            remoteDB[code] = { question: questionText, answer: "", status: "unanswered" };

            return fetch(PROXY_URL + encodeURIComponent(TARGET_URL), {
                method: "POST",
                body: JSON.stringify(remoteDB)
            });
        })
        .then(() => {
            document.getElementById('generatedCode').innerText = code;
            showScreen('codeScreen');
        })
        .catch(() => alert("Connection error. Please try again."));
    }

    function copyCode() {
        navigator.clipboard.writeText(document.getElementById('generatedCode').innerText).then(() => alert("Code copied!"));
    }

    function searchAnswer() {
        const codeInput = document.getElementById('codeInput').value.trim().toUpperCase();
        const resultBox = document.getElementById('answerResult');
        if (!codeInput) { alert("Please enter a code."); return; }
        resultBox.classList.remove('hidden');
        resultBox.innerText = "Searching cloud records...";

        fetch(PROXY_URL + encodeURIComponent(TARGET_URL))
        .then(res => res.status === 404 ? "{}" : res.text())
        .then(text => {
            let remoteDB = {};
            if (text && text.trim() && !text.includes("Cannot GET")) {
                try { remoteDB = JSON.parse(text); } catch(e) {}
            }
            if (remoteDB && remoteDB[codeInput]) {
                const entry = remoteDB[codeInput];
                if (entry.status === "unanswered") {
                    resultBox.innerHTML = `<strong>Question:</strong> ${entry.question}<br><br><span class="status-unanswered">The question is not answered</span>`;
                } else {
                    resultBox.innerHTML = `<strong>Question:</strong> ${entry.question}<br><br><strong>Answer:</strong> ${entry.answer}`;
                }
            } else {
                resultBox.innerHTML = `<span style="color: #ff3b30; font-weight:600;">Code not found.</span>`;
            }
        })
        .catch(() => resultBox.innerText = "Error pulling updates.");
    }
</script>
</body>
</html>
